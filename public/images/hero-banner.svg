<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0f0f1a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#ea580c"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#f9731620" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <!-- Circuit trace lines -->
  <path d="M 0 300 L 200 300 L 250 250 L 400 250 L 450 200 L 700 200 L 750 250 L 1000 250 L 1100 150" fill="none" stroke="#f9731640" stroke-width="2"/>
  <path d="M 1920 700 L 1700 700 L 1650 650 L 1500 650 L 1450 600 L 1200 600 L 1150 550 L 900 550" fill="none" stroke="#f9731625" stroke-width="2"/>
  <circle cx="200" cy="300" r="4" fill="#f97316"/>
  <circle cx="700" cy="200" r="4" fill="#f97316"/>
  <circle cx="1700" cy="700" r="4" fill="#f97316"/>
  <circle cx="1200" cy="600" r="4" fill="#f97316"/>
  <!-- Connector icon (center-left) -->
  <g transform="translate(180, 380)">
    <rect x="0" y="0" width="320" height="120" rx="12" fill="#f9731615" stroke="#f97316" stroke-width="2"/>
    <rect x="20" y="30" width="80" height="60" rx="6" fill="#f9731630"/>
    <rect x="30" y="40" width="12" height="40" rx="3" fill="#f97316"/>
    <rect x="48" y="40" width="12" height="40" rx="3" fill="#f97316"/>
    <rect x="66" y="40" width="12" height="40" rx="3" fill="#f97316"/>
    <rect x="120" y="30" width="80" height="60" rx="6" fill="#f9731630"/>
    <rect x="130" y="40" width="12" height="40" rx="3" fill="#f97316"/>
    <rect x="148" y="40" width="12" height="40" rx="3" fill="#f97316"/>
    <rect x="166" y="40" width="12" height="40" rx="3" fill="#f97316"/>
    <rect x="220" y="30" width="80" height="60" rx="6" fill="#f9731630"/>
    <rect x="230" y="40" width="12" height="40" rx="3" fill="#f97316"/>
    <rect x="248" y="40" width="12" height="40" rx="3" fill="#f97316"/>
    <rect x="266" y="40" width="12" height="40" rx="3" fill="#f97316"/>
  </g>
  <!-- Text: JBJT -->
  <text x="620" y="470" font-family="Arial Black, sans-serif" font-size="80" font-weight="900" fill="#ffffff">JBJT</text>
  <text x="620" y="520" font-family="Arial, sans-serif" font-size="28" fill="#f97316" letter-spacing="8">GLOBAL</text>
  <!-- Tagline -->
  <text x="620" y="580" font-family="Arial, sans-serif" font-size="24" fill="#a1a1aa">Precision Automotive Connectors</text>
  <rect x="620" y="600" width="300" height="4" rx="2" fill="url(#accent)"/>
  <!-- Right side: Quality badges -->
  <g transform="translate(1280, 300)">
    <text font-family="Arial Black" font-size="64" font-weight="900" fill="#f97316">99.9%</text>
    <text y="40" font-family="Arial" font-size="18" fill="#a1a1aa">Quality Pass Rate</text>
  </g>
  <g transform="translate(1280, 480)">
    <text font-family="Arial Black" font-size="64" font-weight="900" fill="#f97316">ISO</text>
    <text y="40" font-family="Arial" font-size="18" fill="#a1a1aa">9001:2015 Certified</text>
  </g>
  <g transform="translate(1280, 660)">
    <text font-family="Arial Black" font-size="64" font-weight="900" fill="#f97316">IATF</text>
    <text y="40" font-family="Arial" font-size="18" fill="#a1a1aa">16949 Automotive Grade</text>
  </g>
</svg>
